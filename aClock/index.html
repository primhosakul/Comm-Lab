<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wave Clock</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>

<div class="wave hour"></div>
<div class="wave minute"></div>
<div class="wave second"></div>

<div id="timeDisplay">00:00:00</div>

<audio id="waveSound" src="waterwave.mp3" loop></audio>

<button id="soundBtn">ON</button>

</body>
</html>
