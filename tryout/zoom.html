<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zoom to Reveal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- This is the "dot" that shows when zoomed out -->
    <div class="dot"></div>

    <!-- This image is hidden until you zoom in deep -->
    <div class="hidden-image-container">
        <img src="https://picsum.photos/200" alt="Revealed Image">
        <p>You found it!</p>
    </div>

</body>
</html>
